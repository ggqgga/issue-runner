<body><h1>Codex 게이트 → 내장 리뷰어 (<code>codex exec review</code>)</h1>
<p class="sub">프롬프트 리뷰(rescue task) 경로를 스크립트 하나로 교체. 판정은 P1/P2 → BLOCKER/WARN 정형 매핑.</p>

<rect class="box chg" x="20" y="130" width="230" height="54"/><text class="lbl" x="135" y="152" text-anchor="middle">verify-runner ③-3 · closeout 1단계</text><text class="small" x="135" y="170" text-anchor="middle">스폰·TaskStop 데드라인 → 동기 호출</text>
<rect class="box chg" x="20" y="210" width="230" height="54"/><text class="lbl" x="135" y="232" text-anchor="middle">BoDAT full-cycle 6절</text><text class="small" x="135" y="250" text-anchor="middle">별도 BoDAT docs PR</text>
<rect class="box new" x="320" y="60" width="270" height="200"/><text class="lbl" x="455" y="82" text-anchor="middle" font-weight="600">scripts/codex-review-gate.sh</text>
<text class="small" x="335" y="104">--base|--commit|--uncommitted [--model] [--effort]</text><text class="small" x="335" y="122">codex exec review … -m gpt-5.6-sol medium</text><text class="small" x="335" y="140">  --ephemeral --json -o review.md</text><text class="small" x="335" y="158">  -c web_search=disabled · memories off</text><text class="small" x="335" y="180">[P1]→BLOCKER · [P2]→WARN · 기타→NIT · 0→CLEAN</text><text class="small" x="335" y="198">stdout 끝줄: verdict=… p1= p2= p3=</text><text class="small" x="335" y="216">exit 0 비차단 · 1 BLOCKER · 2 미산출(fail-closed)</text><text class="small" x="335" y="234">타임아웃 CODEX_GATE_TIMEOUT(900s)</text>
<rect class="box" x="660" y="60" width="220" height="54"/><text class="lbl" x="770" y="82" text-anchor="middle">검증자 리뷰: 코멘트</text><text class="small" x="770" y="100" text-anchor="middle">review.md 본문 + verdict</text>
<rect class="box" x="660" y="140" width="220" height="54"/><text class="lbl" x="770" y="162" text-anchor="middle">exit 2 → general-purpose 폴백</text><text class="small" x="770" y="180" text-anchor="middle">기존 경로 유지</text>
