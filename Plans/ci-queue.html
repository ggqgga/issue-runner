<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>로컬 CI 큐 — 티켓 락 FIFO</title>
<style>
  body { font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; background:#fff; color:#222; margin:0; padding:24px; }
  h1 { font-size:20px; margin:0 0 4px; } p.sub { color:#666; margin:0 0 20px; font-size:13px; }
  svg { max-width:100%; height:auto; display:block; }
  .lbl { font-size:12px; fill:#222; } .small { font-size:10.5px; fill:#555; }
  .box { fill:#f6f8fa; stroke:#8b949e; stroke-width:1; rx:6; }
  .new { fill:#e6f4ea; stroke:#2e7d32; } .chg { fill:#fff8e1; stroke:#f9a825; } .q { fill:#e8f0fe; stroke:#1a73e8; }
  .arrow { stroke:#555; stroke-width:1.3; fill:none; marker-end:url(#a); }
  .dash { stroke-dasharray:4 3; }
  h2 { font-size:15px; margin:28px 0 8px; }
</style>
</head>
<body>
<h1>로컬 CI 큐 — 박스 전역 티켓 락(FIFO)</h1>
<p class="sub">세 진입점 → 단일 <code>ci-queue.sh</code> → 한 번에 하나만 <code>bin/ci</code>. 결과 파일 형식은 불변.</p>

<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs>

  <!-- entry points -->
  <rect class="box chg" x="20" y="30" width="200" height="54"/>
  <text class="lbl" x="120" y="52" text-anchor="middle">hooks/local-ci.sh (push 훅)</text>
  <text class="small" x="120" y="70" text-anchor="middle">cwd + `cd X &amp;&amp;` 파싱 → ROOT/SHA · nohup</text>

  <rect class="box chg" x="20" y="120" width="200" height="54"/>
  <text class="lbl" x="120" y="142" text-anchor="middle">scripts/run-local-ci.sh (루프)</text>
  <text class="small" x="120" y="160" text-anchor="middle">동기 호출 · --slug 메인 · --repo</text>

  <rect class="box" x="20" y="210" width="200" height="54"/>
  <text class="lbl" x="120" y="232" text-anchor="middle">세션 직접 호출</text>
  <text class="small" x="120" y="250" text-anchor="middle">ci-queue.sh run ROOT SHA</text>

  <!-- queue -->
  <rect class="box new" x="300" y="30" width="270" height="234"/>
  <text class="lbl" x="435" y="52" text-anchor="middle" font-weight="600">scripts/ci-queue.sh</text>
  <text class="small" x="315" y="76">1 dedup: result 있으면 exit 0</text>
  <text class="small" x="315" y="94">2 티켓 발급 .queue/&lt;epoch&gt;.&lt;pid&gt;.&lt;sha&gt;</text>
  <text class="small" x="315" y="112">   status pending "대기열 N번째"</text>
  <text class="small" x="315" y="130">3 10초 폴링: 죽은 pid 티켓 회수</text>
  <text class="small" x="315" y="148">   가장 오래된 티켓 ∧ mkdir .running</text>
  <text class="small" x="315" y="166">4 HEAD ≠ SHA → 폐기(exit 2)</text>
  <text class="small" x="315" y="184">   ROOT 없음 → exit 3</text>
  <text class="small" x="315" y="202">5 bin/ci → &lt;slug&gt;/&lt;sha&gt;.{log,result}</text>
  <text class="small" x="315" y="220">   status success/failure</text>
  <text class="small" x="315" y="238">6 rm .running · rm 티켓</text>

  <rect class="box q" x="300" y="290" width="270" height="70"/>
  <text class="lbl" x="435" y="312" text-anchor="middle">~/.claude/.local-ci/.queue/</text>
  <text class="small" x="435" y="330" text-anchor="middle">티켓 파일들 (FIFO = 이름 정렬)</text>
  <text class="small" x="435" y="346" text-anchor="middle">.running/pid — 박스 전역 실행권 1개</text>

  <!-- consumers -->
  <rect class="box chg" x="650" y="30" width="230" height="54"/>
  <text class="lbl" x="765" y="52" text-anchor="middle">ci-gate-before-pr-merge.sh</text>
  <text class="small" x="765" y="70" text-anchor="middle">결과 없음 → status: 실행 중/대기열 N/없음</text>

  <rect class="box" x="650" y="120" width="230" height="54"/>
  <text class="lbl" x="765" y="142" text-anchor="middle">closeout-ci-pass.sh</text>
  <text class="small" x="765" y="160" text-anchor="middle">result 만 읽음 — 변경 없음</text>

  <rect class="box" x="650" y="210" width="230" height="54"/>
  <text class="lbl" x="765" y="232" text-anchor="middle">GitHub commit status</text>
  <text class="small" x="765" y="250" text-anchor="middle">pending(대기/실행) → success/failure</text>

  <!-- arrows -->
  <path class="arrow" d="M220,57 L300,70"/>
  <path class="arrow" d="M220,147 L300,140"/>
  <path class="arrow" d="M220,237 L300,210"/>
  <path class="arrow dash" d="M435,264 L435,290"/>
  <path class="arrow" d="M570,150 L650,57"/>
  <path class="arrow" d="M570,150 L650,147"/>
  <path class="arrow" d="M570,150 L650,237"/>

  <text class="small" x="20" y="400">범례: 초록=신규 · 노랑=변경 · 회색=불변 · 파랑=상태 디렉터리(.local-ci 예외 안)</text>
</svg>

<h2>대상 파일</h2>
<svg viewBox="0 0 900 150" xmlns="http://www.w3.org/2000/svg">
  <text class="lbl" x="20" y="24">issue-runner/</text>
  <text class="small" x="40" y="46">scripts/ci-queue.sh <tspan fill="#2e7d32">(신규)</tspan> · scripts/tests/ci-queue.test.sh <tspan fill="#2e7d32">(신규)</tspan> · bin/ci <tspan fill="#f9a825">(테스트 등록)</tspan></text>
  <text class="small" x="40" y="66">hooks/local-ci.sh <tspan fill="#f9a825">(락 제거·cwd 파싱·큐 호출)</tspan> · hooks/ci-gate-before-pr-merge.sh <tspan fill="#f9a825">(status 분기)</tspan></text>
  <text class="small" x="40" y="86">scripts/run-local-ci.sh <tspan fill="#f9a825">(큐 경유)</tspan> · README.md · README.ko.md · CLAUDE.md <tspan fill="#f9a825">(문서)</tspan></text>
  <text class="small" x="40" y="116">설치: ~/.claude/hooks/local-ci.sh 는 복사본 → 심링크로 교체해야 발효. skills/issue-runner 는 심링크라 pull 즉시.</text>
</svg>
</body>
</html>
