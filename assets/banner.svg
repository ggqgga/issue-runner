<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="issue-runner — autonomous issue to PR loop for Claude Code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#111a2b"/>
      <stop offset="1" stop-color="#0a1420"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#2ea043"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="url(#accent)"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="0" y="0" width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="23.5" fill="none" stroke="#2a3345" stroke-width="1"/>
  <circle cx="965" cy="170" r="200" fill="url(#glow)"/>

  <!-- wordmark -->
  <g transform="translate(72,96)">
    <text x="0" y="0" font-size="16" letter-spacing="4.5" fill="#3fb950" font-weight="600">LOOP-ENGINEERING DISPATCHER</text>
    <text x="-3" y="72" font-size="82" font-weight="700" fill="#f0f6fc" letter-spacing="-1">issue-runner</text>
    <text x="0" y="118" font-size="25" fill="#adbac7">Autonomous issue <tspan fill="#3fb950">&#8594;</tspan> PR loop for Claude Code</text>
    <text x="0" y="160" font-size="16" fill="#5c6b7f" letter-spacing="0.5">Reconcile &#183; Maintain &#183; Dispatch &#183; Report &#8212; you review and merge.</text>
  </g>

  <!-- tick-loop glyph: four arcs forming a cycle with nodes -->
  <g transform="translate(965,170)" fill="none">
    <!-- arcs (each ~78deg, gaps at the 4 nodes) -->
    <g stroke="url(#accent)" stroke-width="7" stroke-linecap="round" marker-end="url(#ah)">
      <path d="M 0,-96 A 96,96 0 0 1 82.3,-49.2"/>
      <path d="M 96,0 A 96,96 0 0 1 49.2,82.3"/>
      <path d="M 0,96 A 96,96 0 0 1 -82.3,49.2"/>
      <path d="M -96,0 A 96,96 0 0 1 -49.2,-82.3"/>
    </g>
    <!-- nodes -->
    <g fill="#0d1117" stroke="url(#accent)" stroke-width="4">
      <circle cx="0" cy="-96" r="13"/>
      <circle cx="96" cy="0" r="13"/>
      <circle cx="0" cy="96" r="13"/>
      <circle cx="-96" cy="0" r="13"/>
    </g>
    <!-- node labels -->
    <g font-size="14" fill="#adbac7" font-weight="600" text-anchor="middle">
      <text x="0" y="-118">Reconcile</text>
      <text x="150" y="4">Maintain</text>
      <text x="0" y="132">Dispatch</text>
      <text x="-146" y="4">Report</text>
    </g>
    <!-- center -->
    <text x="0" y="6" font-size="26" fill="#3fb950" font-weight="700" text-anchor="middle">/loop</text>
  </g>
</svg>
